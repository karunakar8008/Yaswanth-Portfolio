<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a6a"/>
      <stop offset="1" stop-color="#e05330"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- rounded tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#shine)"/>
  <!-- big serif "Y" (Fraunces-inspired) -->
  <text
    x="32" y="34"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="40"
    font-weight="700"
    font-style="italic"
    fill="#faf6f0"
    letter-spacing="-1"
  >Y</text>
  <!-- tiny sage dot — accent -->
  <circle cx="47" cy="49" r="3.5" fill="#78a085"/>
</svg>
